modLoader = "javafml" #mandatory
loaderVersion = "${loader_version_range}" #mandatory
license = "${mod_license}"
#issueTrackerURL="https://change.me.to.your.issue.tracker.example.invalid/" #optional

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
logoFile="logo.png"
authors = "${mod_authors}"
description = '''${mod_description}'''

# access transformer file
[[accessTransformers]]
file="META-INF/accesstransformer.cfg"

[[dependencies."${mod_id}"]]
modId = "forge"
mandatory = true
versionRange = "${forge_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

# 前置：汇流来世本体
[[dependencies."${mod_id}"]]
modId = "confluence"
mandatory = true
versionRange = "[${confluence_version},)"
ordering = "AFTER"
side = "BOTH"

# 前置：把 NeoForge 风格 API 搬到 Forge 1.20.1 的 PortLib
[[dependencies."${mod_id}"]]
modId = "portlib"
mandatory = true
versionRange = "[${portlib_version},)"
ordering = "AFTER"
side = "BOTH"
