## Mod Properties
# The unique mod identifier for the mod. Must be lowercase in English locale. Must fit the regex [a-z][a-z0-9_]{1,63}
# Must match the String constant located in the main mod class annotated with @Mod
mod_id=confluence_music
# The human-readable display name for the mod.
mod_name=ConfluenceMusic
# The license for your mod. Review your options at https://choosealicense.com/. All Rights Reserved is the default.
mod_license=All Rights Reserved
# The mod version. See https://semver.org/
mod_version=1.2.9
# The group ID for the mod. It is only important when publishing as an artifact to a Maven repository.
# This should match the base package used in your mod sources.
mod_group_id=org.confluence.mod
# The authors of this mod. This is a simple text string that is used for display purposes in the mod list.
mod_authors=Westernat, SquidSine
# The description of this mod. This is a simple multiline string that is used for display purposes in the mod list.
mod_description=

systemProp.http.proxyHost=localhost
systemProp.http.proxyPort=7897
systemProp.https.proxyHost=localhost
systemProp.https.proxyPort=7897
